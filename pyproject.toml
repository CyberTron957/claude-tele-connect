[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-phone"
version = "0.1.0"
description = "Let an AI agent make phone calls from your own Android phone and number, with Gemini Live as the voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.65",
    "google-auth>=2.30",
    "numpy>=1.24",
]
keywords = ["phone", "calls", "android", "adb", "gemini", "voice agent", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
bluetooth = ["sounddevice>=0.4.6"]   # bluetooth audio mode on Windows

[project.scripts]
ai-phone = "ai_phone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_phone = ["callaudio.dex"]
