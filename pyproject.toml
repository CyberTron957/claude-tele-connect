[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tele-connect"
version = "0.1.0"
description = "Let an AI agent make phone calls from your own Android phone and number, with Gemini Live (free tier) or OpenAI Realtime as the voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.65",
    "google-auth>=2.30",
    "numpy>=1.24",
    "websockets>=14",
]
keywords = ["phone", "calls", "android", "adb", "gemini", "openai", "grok", "elevenlabs", "pipecat", "realtime", "voice agent", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
bluetooth = ["sounddevice>=0.4.6"]   # bluetooth audio mode on Windows
# Voice providers through Pipecat (grok, pipeline, local). Python 3.11+. Add the services you use, e.g.
#   uv tool install "claude-tele-connect[pipecat]" --with "pipecat-ai[deepgram,elevenlabs,anthropic]"
pipecat = ["pipecat-ai[silero]>=1.16,<2; python_version >= '3.11'"]
grok = ["pipecat-ai[silero,xai]>=1.16,<2; python_version >= '3.11'"]
local = [
    "pipecat-ai[silero,whisper,kokoro,ollama]>=1.16,<2; python_version >= '3.11'",
    "pipecat-ai[mlx-whisper]>=1.16,<2; python_version >= '3.11' and platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
claude-tele-connect = "claude_tele_connect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_tele_connect = ["callaudio.dex", "guides/*.md"]
